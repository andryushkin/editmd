name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The way out of the refusal below. A force-push leaves the previous tip
  # unreachable and there is then no range the workflow can work out for
  # itself; without this the job stays red for good, because a pull request
  # cannot be opened for a commit already on `main` and a re-run replays the
  # same payload. Naming the base by hand is the only thing that can answer it,
  # so the workflow accepts one.
  #
  # Handing the audit its own range is not a way to make it lenient: a base
  # that publishes nothing — the tip itself, say — is refused by
  # `scripts/audit-base.sh` as an empty range, in both guards. That refusal is
  # why this input could be added at all.
  workflow_dispatch:
    inputs:
      base:
        description: The commit the audit range starts at, exclusive
        required: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit
    # Pinned rather than macos-latest: the project needs Xcode 26 (Swift 6.2),
    # and this image is the one that carries it. xcodegen is not preinstalled.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          # audit.sh compares a range against a base; a shallow clone has none,
          # and the script fails closed rather than auditing less than it says.
          fetch-depth: 0
      - name: Install XcodeGen
        run: brew install xcodegen
      # The base decides what the audit can see, so it is computed in a step of
      # its own rather than in an expression: the two awkward cases below need
      # sentences, and an expression has nowhere to put them.
      #
      # `HEAD~1` used to be the base for every push, and that audited ONE COMMIT
      # of a push that publishes many. Measured on a planted branch of two
      # commits with a forbidden word in the first: `HEAD~1` PASSED, the push
      # base FAILED naming the file and the pattern. A push is the moment the
      # commits become public, so the range that has to be clean is the range
      # the push publishes — `github.event.before..HEAD`.
      #
      # Two pushes have no such range, and they are NOT the same case. Creating
      # the ref — the first push of a branch — sets `before` to forty zeros. A
      # force-push does not: it carries the previous tip, which may no longer be
      # reachable from anything. Both are handled, separately, because the
      # second is the one that actually happens.
      #
      # Falling back to `HEAD~1` in either would restore the very defect this
      # replaces, silently and exactly on the pushes that need looking at most.
      # So the job REFUSES and says why. The other option — auditing the whole
      # history — was measured and rejected: from the root commit
      # `check-publicity.sh` exits 1 with hits in 8 commits, because most of
      # them predate the dictionary. A base that is red on every honest run is a
      # base people learn to ignore.
      #
      # The advice a refusal gives has to be advice that can be taken. "Open a
      # pull request" cannot be taken for a commit already on `main`, so it is
      # not offered: what is offered is the audit anyone can run at a terminal,
      # naming the commit the range should start from.
      - name: Resolve the audit base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          MANUAL_BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          refuse() {
              echo "::error::$1"
              cat >&2 <<'EOF'
          The audit refuses rather than narrow its range silently: a base of
          HEAD~1 would check one commit of a push that publishes many.

          Re-run this workflow from the Actions tab with "Run workflow" and give
          it the commit the range starts at, or run the audit at a terminal:

              AUDIT_BASE=<sha> ./scripts/audit.sh
          EOF
              exit 1
          }

          if [ "$EVENT_NAME" = workflow_dispatch ]; then
              git cat-file -e "${MANUAL_BASE}^{commit}" 2>/dev/null \
                  || refuse "The base given by hand ($MANUAL_BASE) is not a commit in this repository."
              echo "AUDIT_BASE=$MANUAL_BASE" >> "$GITHUB_ENV"
              echo "audit base: $MANUAL_BASE (given by hand)"
              exit 0
          fi

          if [ "$EVENT_NAME" = pull_request ]; then
              echo "AUDIT_BASE=origin/$BASE_REF" >> "$GITHUB_ENV"
              echo "audit base: origin/$BASE_REF (pull request)"
              exit 0
          fi
          # All zeros — the ref was created by this push — or empty when the
          # event carries no such field at all.
          if [ -z "${BEFORE//0/}" ]; then
              refuse "This push created the branch, so there is no previous tip to audit against."
          fi
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              refuse "github.event.before ($BEFORE) is not in this repository — the branch was force-pushed and its previous tip is gone."
          fi
          echo "AUDIT_BASE=$BEFORE" >> "$GITHUB_ENV"
          echo "audit base: $BEFORE (the tip this push replaces)"
      - name: Run audit
        run: ./scripts/audit.sh

  build:
    name: Build and test
    runs-on: macos-26
    env:
      # `project.yml` signs with a development identity so the Files-and-Folders
      # grant survives a local rebuild — a certificate no runner has. Ad-hoc
      # here instead of no signing at all: the test bundle is loaded into the
      # host app, which on Apple silicon has to carry a signature, and both
      # sides must agree on the team (empty on both).
      SIGNING: >-
        CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
        CODE_SIGNING_REQUIRED=NO
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate --spec EditMD/project.yml
      - name: Build
        run: |
          xcodebuild -project EditMD/EditMD.xcodeproj -scheme EditMD \
            -destination 'platform=macOS' $SIGNING build
      - name: Test
        # Retried once: the suite has two known warm-up/timing flakes (issue #3).
        # Drop the retry when they are fixed — it hides a real intermittent bug
        # just as well as it hides a known one.
        run: |
          xcodebuild -project EditMD/EditMD.xcodeproj -scheme EditMD \
            -destination 'platform=macOS' $SIGNING \
            -retry-tests-on-failure -test-iterations 2 test
