<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EditMD — Settings · General</title>
<style>
  :root{
    --desk:#c7c7cd; --win-bg:#ececec; --toolbar:#f4f4f5; --toolbar-brd:rgba(0,0,0,.12);
    --card:#ffffff; --text:#1d1d1f; --secondary:rgba(0,0,0,.5); --tertiary:rgba(0,0,0,.34);
    --separator:rgba(0,0,0,.09); --accent:#0068da; --field:#ffffff; --field-brd:rgba(0,0,0,.18);
    --seg:#e6e6e9; --sel:#ffffff; --sans:-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;
    --red:#e5484d;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --desk:#1b1b1d; --win-bg:#2a2a2c; --toolbar:#323234; --toolbar-brd:rgba(255,255,255,.10);
      --card:#333335; --text:#fbfbfc; --secondary:rgba(255,255,255,.55); --tertiary:rgba(255,255,255,.36);
      --separator:rgba(255,255,255,.10); --accent:#4c8ef8; --field:#48484b; --field-brd:rgba(255,255,255,.16);
      --seg:#3a3a3d; --sel:#5a5a5e; --red:#ff6058;
    }
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{background:var(--desk); font-family:var(--sans); color:var(--text); font-size:13px;
    display:flex; align-items:center; justify-content:center; padding:34px; -webkit-font-smoothing:antialiased;}
  .caption{position:fixed; top:14px; left:50%; transform:translateX(-50%); font-size:12px; color:var(--secondary);}

  .window{width:560px; max-height:88vh; background:var(--win-bg); border-radius:11px; overflow:hidden;
    box-shadow:0 26px 70px rgba(0,0,0,.42), 0 0 0 .5px rgba(0,0,0,.28); display:flex; flex-direction:column;}
  .titlebar{background:var(--toolbar); border-bottom:1px solid var(--toolbar-brd); padding:8px 12px 0; position:relative;}
  .lights{display:flex; gap:8px; position:absolute; top:14px; left:14px;}
  .lights i{width:12px; height:12px; border-radius:50%; display:block;}
  .lights .r{background:#ff5f57;} .lights .y{background:#febc2e;} .lights .g{background:#28c840;}
  .tabs{display:flex; justify-content:center; gap:2px;}
  .tab{display:flex; flex-direction:column; align-items:center; gap:3px; width:74px; padding:6px 4px 8px;
    border-radius:7px 7px 0 0; color:var(--secondary); cursor:default; font-size:11px;}
  .tab svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;}
  .tab.on{color:var(--accent); background:var(--win-bg);}
  .tab.on svg{stroke:var(--accent);}

  .form{padding:18px 20px 20px; overflow:auto;}
  .sec{margin-bottom:18px;}
  .sec > h3{font-size:12px; font-weight:600; color:var(--secondary); margin:0 4px 6px;}
  .card{background:var(--card); border-radius:8px; box-shadow:0 0 0 .5px var(--separator);}
  .row{display:flex; align-items:center; min-height:38px; padding:6px 14px; gap:12px;}
  .row + .row{border-top:1px solid var(--separator);}
  .row .lbl{flex:1; color:var(--text);}
  .row .hint{color:var(--secondary); font-size:11.5px; padding:8px 14px;}

  /* controls */
  .popup{display:inline-flex; align-items:center; gap:20px; background:var(--field);
    border:.5px solid var(--field-brd); border-radius:6px; padding:4px 8px 4px 10px; min-width:130px;
    box-shadow:0 .5px 1px rgba(0,0,0,.08);}
  .popup .cv{flex:1; color:var(--text);}
  .popup .chev{width:16px; height:16px; border-radius:4px; background:var(--accent); position:relative;}
  .popup .chev::before,.popup .chev::after{content:""; position:absolute; left:4px; width:8px; height:1.6px; background:#fff; border-radius:1px;}
  .popup .chev::before{top:5px; transform:rotate(0);}
  .segmented{display:inline-flex; background:var(--seg); border-radius:7px; padding:2px; gap:2px;}
  .segmented span{padding:3px 14px; border-radius:5px; color:var(--text); font-size:12.5px;}
  .segmented span.on{background:var(--sel); box-shadow:0 .5px 1.5px rgba(0,0,0,.18);}
  .swatch{width:44px; height:22px; border-radius:5px; box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25);}
  .link{color:var(--accent);}
  .btn{background:var(--field); border:.5px solid var(--field-brd); border-radius:6px; padding:4px 12px;
    color:var(--text); box-shadow:0 .5px 1px rgba(0,0,0,.08);}
  .btn.destructive{color:var(--red);}
</style>
</head>
<body>
  <div class="caption">EditMD · Settings (⌘,) · General — тема, оформление окна, базовые цвета</div>

  <svg style="display:none" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="t-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l1.8-1.4-1.9-3.2L19 6.6a7.6 7.6 0 0 0-2.6-1.5L16 3h-3.9l-.4 2.1A7.6 7.6 0 0 0 9.1 6.6l-2.3-.7L4.9 9.1 6.7 10.5a7.6 7.6 0 0 0 0 3L4.9 14.9l1.9 3.2 2.3-.7a7.6 7.6 0 0 0 2.6 1.5l.4 2.1H16l.4-2.1a7.6 7.6 0 0 0 2.6-1.5l2.3.7 1.9-3.2z"/></symbol>
    <symbol id="t-source" viewBox="0 0 24 24"><polyline points="8 8.5 4 12 8 15.5"/><polyline points="16 8.5 20 12 16 15.5"/><line x1="13.4" y1="6.5" x2="10.6" y2="17.5"/></symbol>
    <symbol id="t-visual" viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2.2"/><line x1="7.5" y1="8.5" x2="16.5" y2="8.5"/><line x1="7.5" y1="12" x2="16.5" y2="12"/><line x1="7.5" y1="15.5" x2="13" y2="15.5"/></symbol>
    <symbol id="t-eye" viewBox="0 0 24 24"><path d="M2.5 12s3.6-6.6 9.5-6.6S21.5 12 21.5 12 17.9 18.6 12 18.6 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.6"/></symbol>
  </defs></svg>

  <div class="window">
    <div class="titlebar">
      <div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div>
      <div class="tabs">
        <div class="tab on"><svg><use href="#t-gear"/></svg>General</div>
        <div class="tab"><svg><use href="#t-source"/></svg>Source</div>
        <div class="tab"><svg><use href="#t-visual"/></svg>Visual</div>
        <div class="tab"><svg><use href="#t-eye"/></svg>Preview</div>
      </div>
    </div>

    <div class="form">
      <div class="sec">
        <h3>Theme</h3>
        <div class="card">
          <div class="row">
            <span class="lbl">Preset</span>
            <span class="popup"><span class="cv">System</span><span class="chev"></span></span>
          </div>
          <div class="row">
            <span class="lbl">Appearance</span>
            <span class="segmented"><span>System</span><span class="on">Light</span><span>Dark</span></span>
          </div>
        </div>
      </div>

      <div class="sec">
        <h3>Base colors</h3>
        <div class="card">
          <div class="row"><span class="lbl">Text</span><span class="swatch" style="background:#1d1d1f"></span></div>
          <div class="row">
            <span class="lbl">Accent / links</span>
            <span class="swatch" style="background:#0068da"></span>
            <span class="link">Reset</span>
          </div>
          <div class="hint">Per-element colors are set separately on each mode tab.</div>
        </div>
      </div>

      <div class="sec">
        <div class="card">
          <div class="row"><span class="btn">Reset General to Defaults</span></div>
          <div class="row"><span class="btn destructive">Reset Everything…</span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
