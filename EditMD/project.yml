name: EditMD
options:
  bundleIdPrefix: andryushkin
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Project-level recommended build settings (Xcode "Update to recommended
# settings"). Set here so xcodegen bakes them into every regenerated pbxproj
# instead of Xcode re-flagging them. Cascades to all targets.
settings:
  base:
    # The product version, project-wide rather than on the app target: three
    # products carry it now — the app, the control CLI, and the MCP proxy —
    # and a version that is written down once cannot disagree with itself.
    # `scripts/dist.sh` and the release skill both read this line by name.
    MARKETING_VERSION: "0.48.1"
    CURRENT_PROJECT_VERSION: "433"
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # "Enable String Catalog Symbol Generation": modern Xcode toggles
    # STRING_CATALOG_GENERATE_SYMBOLS; SWIFT_EMIT_LOC_STRINGS is the older,
    # separate key and does NOT silence that recommendation on its own.
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # A real development identity rather than ad-hoc, because the system binds
    # a Files-and-Folders grant to the code signature: an ad-hoc signature is
    # identified by its cdhash, which changes on every rebuild, so the app had
    # to ask for `~/Documents` again after each build. A development identity
    # is designated by its certificate instead, so the grant survives.
    # Project-wide, not per-target: a test bundle whose team differs from its
    # host app cannot be dlopen'd into it. `dist.sh` re-signs the shipped app
    # with Developer ID and does not read these.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: DZQ4PU9975
    CODE_SIGN_IDENTITY: Apple Development

packages:
  swift-markdown:
    url: https://github.com/apple/swift-markdown
    from: "0.7.3"
  # Native LaTeX typesetter (iosMath port) — renders formulas in Visual
  # (NSTextAttachment images; Preview stays on KaTeX).
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    from: "1.0.0"
  # highlight.js wrapped in JavaScriptCore — fenced-code highlighting in all
  # three modes (Source/Visual color the storage, Preview/PDF emit HTML spans).
  HighlighterSwift:
    url: https://github.com/smittytone/HighlighterSwift
    from: "3.1.0"

targets:
  EditMD:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - EditMD
    resources:
      - path: EditMD/Resources
    dependencies:
      - package: swift-markdown
        product: Markdown
      - package: SwiftMath
        product: SwiftMath
      - package: HighlighterSwift
        product: Highlighter
      # The prebuilt core, the one binary dependency SwiftPM does not fetch.
      # It lives in the repository root rather than next to this spec because
      # SRCROOT is `EditMD/`, and the sandbox profile Xcode gives script
      # phases under ENABLE_USER_SCRIPT_SANDBOXING denies reading the whole
      # SRCROOT subtree except for files declared one by one — declaring the
      # directory grants nothing. Outside SRCROOT the pre-build gate below
      # reads it with no settings changed. `embed: false`: it is a static
      # library, it links into the executable and there is nothing to copy
      # into the bundle.
      - framework: ../Vendor/PrintDotMD.xcframework
        embed: false
    preBuildScripts:
      # Runs before Sources — buildPhases come out as (Verify core, Sources,
      # Resources, Frameworks), and a non-zero exit stops the build there, so
      # a bad core is refused before Swift compiles and long before the
      # linker speaks. A scheme pre-action would not do: its exit status does
      # not fail the build.
      #
      # No `outputFiles`, deliberately: with a stamp file declared, Xcode
      # skips the phase on the second consecutive build (measured: it ran,
      # then it did not), and a gate that runs once is a gate that anything
      # swapped in afterwards walks straight past. Without one it runs every
      # time (measured: 1, 1) for ~3 s, which is what the check is worth.
      # `basedOnDependencyAnalysis: false` states that on purpose; the build
      # log then carries a `note:` saying the phase runs every build, which
      # is the intended arrangement and not something to silence.
      - name: Verify core
        basedOnDependencyAnalysis: false
        script: "\"$SRCROOT/../scripts/verify-core.sh\""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: andryushkin.EditMD
        PRODUCT_NAME: EditMD
        SWIFT_VERSION: "6.2"
        INFOPLIST_FILE: EditMD/App/Info.plist
        # App icon: EditMD/Resources/AppIcon.icns
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
        # System dependencies of the static core library. The list and its
        # order are copied from the core's own link check and must stay equal
        # to it: a static archive carries no link-time dependencies of its
        # own, so whatever it calls has to be named here.
        OTHER_LDFLAGS: -framework CoreFoundation -framework CoreGraphics -framework Security -liconv

  EditMDTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - EditMDTests
    dependencies:
      - target: EditMD
      - package: swift-markdown
        product: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: andryushkin.EditMDTests
        SWIFT_VERSION: "6.2"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES

  # CLI for the control socket (v38) + the offline vault engine (plan 10).
  # Shares the pure protocol and link-graph engine sources with the app —
  # everything listed here must stay AppKit-free.
  editmdctl:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - editmdctl
      - path: EditMD/Integration/ControlProtocol.swift
      - path: EditMD/Integration/MCPProtocol.swift
      - path: EditMD/Integration/ControlGraphPayload.swift
      - path: EditMD/Editor/PathScope.swift
      - path: EditMD/Editor/LinkGraphEngine.swift
      - path: EditMD/Editor/WikiLinkCore.swift
      - path: EditMD/Editor/LinkIndexPersistence.swift
      - path: EditMD/Editor/LinkScan.swift
      - path: EditMD/Editor/WikiLink.swift
      - path: EditMD/Editor/LineIndex.swift
      - path: EditMD/Editor/MathScan.swift
      - path: EditMD/Editor/MarkdownOutline.swift
      - path: EditMD/Editor/VaultLint.swift
      - path: EditMD/Editor/WikiCompletion.swift
      - path: EditMD/Editor/Frontmatter.swift
      - path: EditMD/Editor/TagScan.swift
      - path: EditMD/Editor/SearchQuery.swift
      - path: EditMD/Editor/SearchMatch.swift
      - path: EditMD/Editor/ImageFileTypes.swift
    dependencies:
      - package: swift-markdown
        product: Markdown
    settings:
      base:
        PRODUCT_NAME: editmdctl
        PRODUCT_BUNDLE_IDENTIFIER: andryushkin.editmdctl
        SWIFT_VERSION: "6.2"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # Protocol files only need Foundation; MCPProtocol is pure JSON codec.
        GENERATE_INFOPLIST_FILE: YES
        # A command-line tool is not a bundle, so the generated Info.plist has
        # nowhere to live unless it is embedded in the binary itself. Without
        # this, `Bundle.main.infoDictionary` is empty here — measured, and it
        # is why `editmdctl --version` had nothing to read. The app gets the
        # same values from the same project-level setting, so the two products
        # of one build cannot name different versions.
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES

  # MCP stdio proxy → control socket (plan 09 stage 6). Optional rich layer.
  editmd-mcp:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - editmd-mcp
      - path: EditMD/Editor/PathScope.swift
      - path: EditMD/Integration/ControlProtocol.swift
      - path: EditMD/Integration/MCPProtocol.swift
    settings:
      base:
        PRODUCT_NAME: editmd-mcp
        PRODUCT_BUNDLE_IDENTIFIER: andryushkin.editmd-mcp
        SWIFT_VERSION: "6.2"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES

# The scheme is generated right here — Xcode used to auto-create it in
# xcuserdata, and any `xcodegen generate` lost it (xcodebuild: "does not
# contain a scheme").
schemes:
  EditMD:
    build:
      targets:
        EditMD: all
        editmdctl: all
        editmd-mcp: all
    run:
      config: Debug
    test:
      config: Debug
      gathersCoverageData: false
      # Force English in the test host: UI-string assertions must not depend
      # on the machine's macOS language now that ru localization exists.
      commandLineArguments:
        "-AppleLanguages (en)": true
      targets:
        - EditMDTests
    profile:
      config: Release
    archive:
      config: Release

  editmdctl:
    build:
      targets:
        editmdctl: all
    run:
      config: Debug
