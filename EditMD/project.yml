name: EditMD
options:
  bundleIdPrefix: com.editmd
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Project-level recommended build settings (Xcode "Update to recommended
# settings"). Set here so xcodegen bakes them into every regenerated pbxproj
# instead of Xcode re-flagging them. Cascades to all targets.
settings:
  base:
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # "Enable String Catalog Symbol Generation": modern Xcode toggles
    # STRING_CATALOG_GENERATE_SYMBOLS; SWIFT_EMIT_LOC_STRINGS is the older,
    # separate key and does NOT silence that recommendation on its own.
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  swift-markdown:
    url: https://github.com/apple/swift-markdown
    from: "0.7.3"
  # Native LaTeX typesetter (iosMath port) — renders formulas in Visual
  # (NSTextAttachment images; Preview stays on KaTeX).
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    from: "1.0.0"
  # highlight.js wrapped in JavaScriptCore — fenced-code highlighting in all
  # three modes (Source/Visual color the storage, Preview/PDF emit HTML spans).
  HighlighterSwift:
    url: https://github.com/smittytone/HighlighterSwift
    from: "3.1.0"

targets:
  EditMD:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - EditMD
    resources:
      - path: EditMD/Resources
    dependencies:
      - package: swift-markdown
        product: Markdown
      - package: SwiftMath
        product: SwiftMath
      - package: HighlighterSwift
        product: Highlighter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.editmd.app
        PRODUCT_NAME: EditMD
        MARKETING_VERSION: "0.47.10"
        CURRENT_PROJECT_VERSION: "425"
        SWIFT_VERSION: "6.2"
        INFOPLIST_FILE: EditMD/App/Info.plist
        # App icon: EditMD/Resources/AppIcon.icns
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES

  EditMDTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - EditMDTests
    dependencies:
      - target: EditMD
      - package: swift-markdown
        product: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.editmd.tests
        SWIFT_VERSION: "6.2"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES

  # CLI for the control socket (v38) + the offline vault engine (plan 10).
  # Shares the pure protocol and link-graph engine sources with the app —
  # everything listed here must stay AppKit-free.
  editmdctl:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - editmdctl
      - path: EditMD/Integration/ControlProtocol.swift
      - path: EditMD/Integration/MCPProtocol.swift
      - path: EditMD/Integration/ControlGraphPayload.swift
      - path: EditMD/Editor/LinkGraphEngine.swift
      - path: EditMD/Editor/WikiLinkCore.swift
      - path: EditMD/Editor/LinkIndexPersistence.swift
      - path: EditMD/Editor/LinkScan.swift
      - path: EditMD/Editor/WikiLink.swift
      - path: EditMD/Editor/LineIndex.swift
      - path: EditMD/Editor/MathScan.swift
      - path: EditMD/Editor/MarkdownOutline.swift
      - path: EditMD/Editor/VaultLint.swift
      - path: EditMD/Editor/WikiCompletion.swift
      - path: EditMD/Editor/Frontmatter.swift
      - path: EditMD/Editor/TagScan.swift
      - path: EditMD/Editor/SearchQuery.swift
      - path: EditMD/Editor/SearchMatch.swift
      - path: EditMD/Editor/ImageFileTypes.swift
    dependencies:
      - package: swift-markdown
        product: Markdown
    settings:
      base:
        PRODUCT_NAME: editmdctl
        PRODUCT_BUNDLE_IDENTIFIER: com.editmd.ctl
        SWIFT_VERSION: "6.2"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # Protocol files only need Foundation; MCPProtocol is pure JSON codec.
        GENERATE_INFOPLIST_FILE: YES

  # MCP stdio proxy → control socket (plan 09 stage 6). Optional rich layer.
  editmd-mcp:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - editmd-mcp
      - path: EditMD/Integration/ControlProtocol.swift
      - path: EditMD/Integration/MCPProtocol.swift
    settings:
      base:
        PRODUCT_NAME: editmd-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.editmd.mcp
        SWIFT_VERSION: "6.2"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES

# The scheme is generated right here — Xcode used to auto-create it in
# xcuserdata, and any `xcodegen generate` lost it (xcodebuild: "does not
# contain a scheme").
schemes:
  EditMD:
    build:
      targets:
        EditMD: all
        editmdctl: all
        editmd-mcp: all
    run:
      config: Debug
    test:
      config: Debug
      gathersCoverageData: false
      # Force English in the test host: UI-string assertions must not depend
      # on the machine's macOS language now that ru localization exists.
      commandLineArguments:
        "-AppleLanguages (en)": true
      targets:
        - EditMDTests
    profile:
      config: Release
    archive:
      config: Release

  editmdctl:
    build:
      targets:
        editmdctl: all
    run:
      config: Debug
