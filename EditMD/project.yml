name: EditMD
options:
  bundleIdPrefix: com.editmd
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  swift-markdown-ui:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.0.2"
  swift-cmark:
    url: https://github.com/swiftlang/swift-cmark
    from: "0.7.1"

targets:
  EditMD:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - EditMD
    resources:
      - path: EditMD/Resources
    dependencies:
      - package: swift-markdown-ui
        product: MarkdownUI
      - package: swift-cmark
        product: cmark-gfm
      - package: swift-cmark
        product: cmark-gfm-extensions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.editmd.app
        PRODUCT_NAME: EditMD
        SWIFT_VERSION: "6.2"
        INFOPLIST_FILE: EditMD/App/Info.plist
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete

  EditMDTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - EditMDTests
    dependencies:
      - target: EditMD
      - package: swift-cmark
        product: cmark-gfm
      - package: swift-cmark
        product: cmark-gfm-extensions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.editmd.tests
        SWIFT_VERSION: "6.2"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
