name: EditMD
options:
  bundleIdPrefix: com.editmd
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  swift-markdown:
    url: https://github.com/apple/swift-markdown
    from: "0.7.3"

targets:
  EditMD:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - EditMD
    resources:
      - path: EditMD/Resources
    dependencies:
      - package: swift-markdown
        product: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.editmd.app
        PRODUCT_NAME: EditMD
        MARKETING_VERSION: "0.36.1"
        CURRENT_PROJECT_VERSION: "361"
        SWIFT_VERSION: "6.2"
        INFOPLIST_FILE: EditMD/App/Info.plist
        # App icon: EditMD/Resources/AppIcon.icns (from docs/img/icon.png master)
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete

  EditMDTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - EditMDTests
    dependencies:
      - target: EditMD
      - package: swift-markdown
        product: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.editmd.tests
        SWIFT_VERSION: "6.2"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
