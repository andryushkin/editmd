name: EditMD
options:
  bundleIdPrefix: com.editmd
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  swift-markdown:
    url: https://github.com/apple/swift-markdown
    from: "0.7.3"
  # Нативный LaTeX-типограф (порт iosMath) — рендер формул в Visual
  # (NSTextAttachment-картинки; Preview остаётся на KaTeX).
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    from: "1.0.0"
  # Обёртка highlight.js в JavaScriptCore — подсветка код-блоков во всех
  # трёх режимах (Source/Visual красят storage, Preview/PDF — HTML-спаны).
  HighlighterSwift:
    url: https://github.com/smittytone/HighlighterSwift
    from: "3.1.0"

targets:
  EditMD:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - EditMD
    resources:
      - path: EditMD/Resources
    dependencies:
      - package: swift-markdown
        product: Markdown
      - package: SwiftMath
        product: SwiftMath
      - package: HighlighterSwift
        product: Highlighter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.editmd.app
        PRODUCT_NAME: EditMD
        MARKETING_VERSION: "0.41.3"
        CURRENT_PROJECT_VERSION: "412"
        SWIFT_VERSION: "6.2"
        INFOPLIST_FILE: EditMD/App/Info.plist
        # App icon: EditMD/Resources/AppIcon.icns (from docs/img/icon.png master)
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete

  EditMDTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - EditMDTests
    dependencies:
      - target: EditMD
      - package: swift-markdown
        product: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.editmd.tests
        SWIFT_VERSION: "6.2"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES

  # Thin CLI for the control socket (v38). Shares pure protocol sources with the app.
  editmdctl:
    type: tool
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - editmdctl
      - path: EditMD/Integration/ControlProtocol.swift
      - path: EditMD/Integration/MCPProtocol.swift
    settings:
      base:
        PRODUCT_NAME: editmdctl
        PRODUCT_BUNDLE_IDENTIFIER: com.editmd.ctl
        SWIFT_VERSION: "6.2"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # Protocol files only need Foundation; MCPProtocol is pure JSON codec.
        GENERATE_INFOPLIST_FILE: YES

# Схема генерируется здесь же — раньше её автосоздавал Xcode в xcuserdata,
# и любой `xcodegen generate` её терял (xcodebuild: "does not contain a scheme").
schemes:
  EditMD:
    build:
      targets:
        EditMD: all
        editmdctl: all
    run:
      config: Debug
    test:
      config: Debug
      gathersCoverageData: false
      targets:
        - EditMDTests
    profile:
      config: Release
    archive:
      config: Release

  editmdctl:
    build:
      targets:
        editmdctl: all
    run:
      config: Debug
